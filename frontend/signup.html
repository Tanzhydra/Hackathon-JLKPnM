<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EduQuest</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
</head>
<body class="bg-[#0b0f19] flex justify-center items-center h-screen m-0 overflow-hidden font-['Poppins',sans-serif]">

    <!-- BUNGKUS UTAMA -->
    <div id="main-wrapper" class="relative w-[1280px] h-[720px] shadow-2xl overflow-hidden bg-cover bg-center transition-all duration-500" style="background-image: url('assets/Background_web.png');">
        
        <!-- LAPISAN UI HTML -->
        <div id="ui-layer" class="absolute top-0 left-0 w-full h-full z-[1000] pointer-events-none flex justify-center items-center">
            
            <!-- 3. SIGN UP SCREEN -->
            <div id="signup-screen" class="ui-screen pointer-events-auto absolute inset-0 flex flex-col justify-center items-center bg-black/5 backdrop-blur-[2px]">
                <div class="relative w-[450px] bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl border border-blue-100 text-left">
                    <div class="flex gap-2 mb-6 bg-slate-100 p-1 rounded-xl w-fit">
                        <button onclick="window.location.href='signin.html'" class="px-4 py-1.5 rounded-lg text-slate-600 font-medium text-sm hover:bg-slate-200 transition">Sign In</button>
                        <button class="px-4 py-1.5 rounded-lg bg-slate-900 text-white font-medium text-sm">Sign Up</button>
                    </div>

                    <h2 class="text-xl font-bold text-slate-800 mb-1">Create New Account</h2>
                    <p class="text-xs text-slate-500 mb-6">Daftar akun baru untuk mengakses layanan.</p>
                    
                    <div class="space-y-3">
                        <div>
                            <input type="text" id="su-nama" placeholder="Nama lengkap..." class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-sm outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <input type="text" id="su-id" placeholder="NRP atau NIP..." class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-sm outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <input type="text" id="su-class" placeholder="Kelas sesuai Form 14..." class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-sm outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <input type="text" id="su-program" placeholder="Kode program studi..." class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-sm outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <input type="email" id="su-email" placeholder="email@domain.com..." class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-sm outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <input type="password" id="su-pass" placeholder="Password (••••••••)" class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-sm outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 mt-6">
                        <button id="btn-submit-signup" class="w-full py-3 rounded-xl bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 transition shadow-md">Daftar</button>
                        <button onclick="window.location.href='signin.html'" class="w-full py-2.5 rounded-xl border border-slate-300 text-slate-700 font-semibold text-xs hover:bg-slate-50 transition">Sudah Punya Akun? Sign In</button>
                    </div>
                    <p id="signup-status" role="status" class="text-xs text-slate-700 mt-4"></p>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="game.js?v=auth-supabase-2"></script>
</body>
</html>
