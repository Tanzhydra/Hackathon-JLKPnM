<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQuest - BAAK PENS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b0f19] flex justify-center items-center h-screen m-0 overflow-hidden font-['Poppins',sans-serif]">

    <!-- BUNGKUS UTAMA (Background web dipasang di sini) -->
    <div id="main-wrapper" class="relative w-[1280px] h-[720px] shadow-2xl overflow-hidden bg-cover bg-center transition-all duration-500" style="background-image: url('assets/Background_web.png');">
        
        <!-- LAPISAN UI HTML -->
        <div id="ui-layer" class="absolute top-0 left-0 w-full h-full z-[1000] pointer-events-none flex justify-center items-center">
            
            <!-- 1. OPENING SCREEN -->
            <div id="opening-screen" class="ui-screen pointer-events-auto absolute inset-0 flex flex-col justify-center items-center bg-black/5 backdrop-blur-[2px]">
                <div class="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl text-center max-w-md border border-white/50">
                    <h1 class="text-2xl font-bold text-slate-800 mb-2">EduQuest</h1>
                    <p class="text-slate-600 mb-6 text-sm">Sistem Layanan Presensi & Koreksi Otomatis Kampus</p>
                    <button onclick="window.location.href='signin.html'" class="w-full py-3 rounded-xl bg-blue-600 text-white font-semibold shadow-md hover:bg-blue-700 transition">Mulai Masuk</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
